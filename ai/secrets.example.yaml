# Keys a host's secrets file must hold; encrypt a copy with sops. Values here describe
# the expected content and are not usable secrets.
requesty:
  api_key: Requesty key for this customer's stack
n8n:
  encryption_key: random 32+ characters; changing it later needs an n8n migration
  runner_auth_token: random 32+ characters
  db_password: openssl rand -hex 32 (letters and digits only)
hermes:
  api_server_key: random 32+ characters
  # Kept for the operator; only the hash is deployed.
  dashboard_password: the initial dashboard password
  dashboard_password_hash: scrypt hash of dashboard_password (scrypt$16384$...)
  dashboard_session_secret: random 32+ characters
  # Only with services.aiStack.hermes.telegram:
  telegram_bot_token: token from BotFather
  telegram_allowed_users: comma-separated numeric Telegram user IDs
# Only on the monitoring server:
grafana:
  admin_password: initial Grafana admin password
  secret_key: random 32+ characters
# Only with services.aiStack.features.onyx. Compose expands `$`, so no value may contain one.
onyx:
  user_auth_secret: openssl rand -hex 32
  encryption_key: openssl rand -hex 16 (32 characters; encrypts stored connector credentials)
  postgres_password: openssl rand -hex 32
  opensearch_password: upper and lower case, digit and symbol, e.g. Aa1- followed by openssl rand -hex 24
# Only with services.aiStack.features.paperless:
paperless:
  admin_password: initial Paperless admin password
# Only with services.aiStack.backup.repository:
backup:
  restic_password: random 32+ characters; keep an offline copy, the backups are unreadable without it
  ssh_key: private SSH key of the Storage Box sub-account (sftp repositories only)
