name: Hermes release lock

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths: [flake.nix, flake.lock]

permissions:
  contents: write

concurrency:
  group: hermes-release-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lock:
    if: >-
      github.event.pull_request.user.login == 'renovate[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'renovate/hermes-agent-stable'
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3
      - name: Refresh Hermes lock
        run: nix flake update hermes-agent
      # GITHUB_TOKEN pushes do not trigger nix-build.yml. Check the updated lock
      # here rather than relying on CI for the original version-only commit.
      - name: Check updated flake
        run: |
          nix flake check
          nix build --dry-run .#nixosConfigurations.alucard.config.system.build.toplevel
          nix build --dry-run .#nixosConfigurations.dracula.config.system.build.toplevel
      - name: Commit updated lock
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet -- flake.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add flake.lock
          git commit -m "chore(deps): refresh Hermes release lock"
          git push origin "HEAD:$HEAD_BRANCH"
