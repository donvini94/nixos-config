# Version bumps for the locally packaged tools in packages/ and coding-agents/packages/.
#
# Renovate deliberately does not do this. Its regex manager can only rewrite the
# version string, and every package here also pins a source hash (lathe pins a
# vendorHash too), so a version-only bump yields a branch that cannot build.
# nix-update resolves the newest upstream release and rewrites version and hashes
# together, then `--build` proves the result before a PR exists.
#
# The PR is opened with GITHUB_TOKEN, and GitHub does not start workflow runs for
# events that token triggers — so nix-build.yml will NOT run on these PRs by
# itself. That is why the build happens here, in the job that opens the PR. Push
# any commit to the branch (or close/reopen the PR) to get the full matrix.
name: Package updates

on:
  schedule:
    # Monday 03:00 UTC, off the Renovate window (weekday evenings, Europe/Berlin).
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# See nix-build.yml: unauthenticated github: input resolution hits the anonymous
# API rate limit and fails evaluation with 429.
env:
  NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

jobs:
  update:
    name: nix-update ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The hash-pinned attributes of packages.x86_64-linux in flake.nix (omp installs
        # its own latest release; handy and tapeback follow nixpkgs). lathe is built for both systems but its hashes are
        # platform-independent, so bumping it here covers the Mac as well. zotero tracks
        # its pinned Firefox ESR line, which nix-update cannot see.
        package:
          - lathe
          - linear-cli
          - zotero
    concurrency:
      group: package-update-${{ matrix.package }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3

      - name: Bump ${{ matrix.package }}
        run: |
          if [ "${{ matrix.package }}" = zotero ]; then
            # Newest release of the pinned ESR major, with its own download hash.
            old=$(grep -oE '[0-9]+\.[0-9.]+esr' packages/zotero.nix | head -1)
            new=$(curl -fsSL https://archive.mozilla.org/pub/firefox/releases/ \
              | grep -oE "${old%%.*}\.[0-9]+(\.[0-9]+)?esr" | sort -uV | tail -1)
            old_hash=$(grep -oE 'sha256-[A-Za-z0-9+/=]+' packages/zotero.nix)
            url="https://archive.mozilla.org/pub/firefox/releases/$new/linux-x86_64/en-US/firefox-$new.tar.xz"
            hash=$(nix store prefetch-file --json "$url" | jq -r .hash)
            sed -i "s|$old|$new|g; s|$old_hash|$hash|" packages/zotero.nix
            nix build --no-link .#packages.x86_64-linux.zotero
            exit 0
          fi
          nix run nixpkgs#nix-update -- \
            --flake --version=stable --build "${{ matrix.package }}"
          # The release version is shared; refresh the Mac archive hash too.
          if [ "${{ matrix.package }}" = linear-cli ]; then
            old=$(nix eval --raw .#packages.aarch64-darwin.linear-cli.src.outputHash)
            url=$(nix eval --raw .#packages.aarch64-darwin.linear-cli.src.url)
            hash=$(nix store prefetch-file --json "$url" | jq -r .hash)
            sed -i "s|$old|$hash|" packages/linear-cli.nix
          fi

      - name: Open a pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "${{ matrix.package }} is already at the newest release."
            exit 0
          fi

          version=$(nix eval --raw ".#packages.x86_64-linux.${{ matrix.package }}.version")
          if [ "${{ matrix.package }}" = zotero ]; then
            version="$version-firefox-$(grep -oE '[0-9]+\.[0-9.]+esr' packages/zotero.nix | head -1)"
          fi
          branch="nix-update/${{ matrix.package }}-$version"
          title="chore(deps): update ${{ matrix.package }} to $version"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "$title"
          git push --force-with-lease -u origin "$branch"

          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "PR for $branch already open; branch updated in place."
            exit 0
          fi

          gh pr create --title "$title" --body "$(cat <<EOF
          \`nix-update --flake --version=stable --build ${{ matrix.package }}\` rewrote the
          version and every pinned hash, and built the result on the runner before this PR
          was opened.

          nix-build.yml does not run on PRs opened by GITHUB_TOKEN. Push a commit to this
          branch, or close and reopen the PR, to get the host build plans and the
          \`Local packages\` matrix.
          EOF
          )"
