name: Nix checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: nix-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job resolves github: flake inputs. Unauthenticated, that is the shared
# 60 requests/hour anonymous limit across all five jobs, and api.github.com
# answers 429 mid-evaluation. The runner token raises it to 1000/hour.
env:
  NIX_CONFIG: "access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}"

jobs:
  build:
    name: NixOS build plan (${{ matrix.host }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host:
          - dracula
          - alucard
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3
      # Dracula's 67.4 GiB closure cannot fit on a GitHub-hosted runner. This
      # still evaluates the complete build graph; restore realization on a
      # self-hosted runner with enough Nix storage.
      - run: nix build --dry-run --no-link .#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel

  darwin:
    name: Darwin build plan (AC-0137)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3
      # Evaluates the whole darwin closure without realizing it: the toplevel is
      # ~7 GiB unpacked, and `nix flake check` deliberately does not build it.
      - run: nix build --dry-run --no-link '.#darwinConfigurations."AC-0137".system'

  packages:
    name: Local packages (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-latest
          - system: aarch64-darwin
            runner: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3
      # REALIZED, not planned. The host jobs above run --dry-run, which never
      # runs a fixed-output derivation, so a version bump left with a stale
      # `hash`/`vendorHash` is invisible to them and only fails at switch time.
      # These closures are small enough to actually build on a hosted runner.
      - name: Build every hash-pinned package
        run: |
          attrs=$(nix eval --json --apply builtins.attrNames \
            ".#packages.${{ matrix.system }}" | jq -r '.[]')
          for attr in $attrs; do
            nix build --no-link --print-build-logs ".#packages.${{ matrix.system }}.$attr"
          done

  checks:
    name: Flake checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3
      - run: nix flake check
