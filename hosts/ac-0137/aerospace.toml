# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = []

exec-on-workspace-change = ['/bin/bash', '-c',
    '@sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE']

# Update sketchybar app icons when focus changes between windows
on-focus-changed = ['exec-and-forget @sketchybar@ --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$(/opt/homebrew/bin/aerospace list-workspaces --focused)']
start-at-login = true
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 0

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

automatically-unhide-macos-hidden-apps = false

[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 4
    inner.vertical =   4
    outer.left =       4
    outer.bottom =     4
    outer.top =        [{ monitor."dell" = 46 }, {monitor."LG" = 40}, { monitor.built-in = 4 }, 4]
    outer.right =      4

# 'main' binding mode declaration
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# 'main' binding mode must be always presented
# Fallback value (if you omit the key): mode.main.binding = {}
[mode.main.binding]

    # See: https://nikitabobko.github.io/AeroSpace/commands#focus
    alt-h = 'focus left'
    alt-j = 'focus down'
    alt-k = 'focus up'
    alt-l = 'focus right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move
    alt-shift-h = 'move left'
    alt-shift-j = 'move down'
    alt-shift-k = 'move up'
    alt-shift-l = 'move right'

    # See: https://nikitabobko.github.io/AeroSpace/commands#resize
    alt-minus = 'resize smart -50'
    alt-equal = 'resize smart +50'



    f10 = 'volume mute-toggle'
    f11 = 'volume down'
    f12 = 'volume up'

    # See: https://nikitabobko.github.io/AeroSpace/commands#workspace
    alt-1 = 'workspace 1'
    alt-2 = 'workspace 2'
    alt-3 = 'workspace 3'
    alt-4 = 'workspace 4'
    alt-5 = 'workspace 5'
    alt-6 = 'workspace 6'
    alt-7 = 'workspace 7'
    alt-8 = 'workspace 8'
    alt-9 = 'workspace 9'

    alt-enter = 'exec-and-forget open -n -a Ghostty'
    alt-n = 'exec-and-forget open -n -a Ghostty --args -e yazi'
    alt-q = 'close'
    alt-shift-s = 'exec-and-forget open /Applications/Signal.app'
    alt-shift-d = 'exec-and-forget open /Applications/Discord.app'
    alt-s = 'exec-and-forget screencapture -i -c'
    alt-a = 'exec-and-forget open /Applications/Anki.app'
    alt-z = 'exec-and-forget open /Applications/Zotero.app'
    alt-t = 'exec-and-forget open /Applications/Termius.app'
    alt-o = 'exec-and-forget open /Applications/Microsoft Outlook.app'
    alt-e = 'exec-and-forget /opt/homebrew/bin/emacsclient -c -n'
    alt-w = 'exec-and-forget /Applications/Firefox\ Developer\ Edition.app/Contents/MacOS/firefox --new-window'
    alt-shift-esc = 'exec-and-forget pmset sleepnow'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-node-to-workspace
    alt-shift-1 = 'move-node-to-workspace 1'
    alt-shift-2 = 'move-node-to-workspace 2'
    alt-shift-3 = 'move-node-to-workspace 3'
    alt-shift-4 = 'move-node-to-workspace 4'
    alt-shift-5 = 'move-node-to-workspace 5'
    alt-shift-6 = 'move-node-to-workspace 6'
    alt-shift-7 = 'move-node-to-workspace 7'
    alt-shift-8 = 'move-node-to-workspace 8'
    alt-shift-9 = 'move-node-to-workspace 9'

    # See: https://nikitabobko.github.io/AeroSpace/commands#move-workspace-to-monitor
    alt-shift-tab = 'move-workspace-to-monitor --wrap-around next'
    alt-tab = 'workspace-back-and-forth'

    # See: https://nikitabobko.github.io/AeroSpace/commands#mode
    alt-shift-semicolon = 'mode service'
    alt-f = 'layout tiles accordion'
    alt-v = 'layout floating tiling'
# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
[mode.service.binding]
    esc = ['reload-config', 'mode main']
    r = ['flatten-workspace-tree', 'mode main'] # reset layout
    backspace = ['close-all-windows-but-current', 'mode main']

    # sticky is not yet supported https://github.com/nikitabobko/AeroSpace/issues/2
    #s = ['layout sticky tiling', 'mode main']

    alt-shift-h = ['join-with left', 'mode main']
    alt-shift-j = ['join-with down', 'mode main']
    alt-shift-k = ['join-with up', 'mode main']
    alt-shift-l = ['join-with right', 'mode main']

    down = 'volume down'
    up = 'volume up'
    shift-down = ['volume set 0', 'mode main']


[workspace-to-monitor-force-assignment]
    9 = '^built-in retina display$'  # Case insensitive regex match
    3 = '^built-in retina display$'  # Case insensitive regex match

# Messaging apps → workspace 9
[[on-window-detected]]
if.app-id = 'com.tinyspeck.slackmacgap'
run = ['move-node-to-workspace 9']

[[on-window-detected]]
if.app-id = 'org.whispersystems.signal-desktop'
run = ['move-node-to-workspace 9']

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = ['move-node-to-workspace 9']

[[on-window-detected]]
if.app-id = 'com.microsoft.teams2'
run = ['move-node-to-workspace 9']

[[on-window-detected]]
if.app-id = 'com.hnc.Discord'
run = ['move-node-to-workspace 9']

# Anki → workspace 4
[[on-window-detected]]
if.app-id = 'net.ankiweb.launcher'
run = ['move-node-to-workspace 4']

# Jellyfin Media Player: float it so AeroSpace never imposes a tile frame on its window.
# JMP keeps its Qt window maximized during playback; when AeroSpace parks a maximized/tiled
# window off-screen to hide a background workspace, Qt re-asserts the maximized state, which
# raises+activates the window -> AeroSpace follows focus back -> rapid workspace-switch storm
# while a backgrounded video plays. Floating removes AeroSpace's frame-fighting with Qt.
[[on-window-detected]]
if.app-id = 'tv.jellyfin.player'
run = ['layout floating']
