services:
  # VPN container - all torrent traffic goes through this
  gluetun:
    image: qmcgaw/gluetun:latest@sha256:89e3cbe22e0d6f09a18d3e86269392fd9f7f08e8991040741e577f8f127cdfe4
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "127.0.0.1:18080:18080"  # qBittorrent web UI (LOCALHOST ONLY) - SECURITY FIX
    volumes:
      - /var/lib/media-stack/gluetun:/gluetun
    environment:
      - VPN_SERVICE_PROVIDER=mullvad
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${MULLVAD_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${MULLVAD_ADDRESSES}
      - WIREGUARD_ENDPOINT_PORT=51820
      # No WIREGUARD_PUBLIC_KEY here on purpose. That option pins ONE server's
      # key, but gluetun rotates endpoints within SERVER_COUNTRIES, so a pin
      # makes every other server fail — and silently, because WireGuard does
      # not answer a handshake encrypted to the wrong peer key: you see tun0
      # transmitting with zero bytes received. Mullvad rotates server keys, so
      # a pin also rots on its own. For a supported provider gluetun takes the
      # correct per-server key from its own server list; only VPN_SERVICE_
      # PROVIDER=custom needs the key spelled out.
      - UPDATER_PERIOD=24h

      # DNS and firewall
      - SERVER_COUNTRIES=Switzerland,Netherlands  # Closest to your location
      - FIREWALL_INPUT_PORTS=18080  # Allow qBittorrent web UI
      - TZ=Europe/Amsterdam
    restart: unless-stopped
    networks:
      - media-network

  # qBittorrent - uses Gluetun's network stack (VPN-isolated)
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest@sha256:8d48fa8c619caadfb103f04efea8747e2a2762d6c7551690919cffb987e61cee
    container_name: qbittorrent
    network_mode: "service:gluetun"  # Share Gluetun's network (VPN)
    environment:
      - PUID=1001  # jellyfin user ID
      - PGID=987  # jellyfin group ID
      - TZ=Europe/Berlin
      - WEBUI_PORT=18080
      - TORRENTING_PORT=6881
    volumes:
      - /var/lib/media-stack/qbittorrent:/config
      - /mnt/hetzner/downloads:/downloads
    depends_on:
      gluetun:
        condition: service_healthy
        restart: true  # Restart when dependency restarts
    restart: unless-stopped

  # Sonarr - TV show automation (uses regular internet)
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest@sha256:4d9df314875e1249ab7d6170c2b9b3dc1d8e6383f168ceb10dc9a5ad9b324739
    container_name: sonarr
    environment:
      - PUID=1001
      - PGID=987
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/media-stack/sonarr:/config
      - /mnt/hetzner/shows:/tv
      - /mnt/hetzner/downloads:/downloads
    ports:
      - "127.0.0.1:18989:8989"  # LOCALHOST ONLY - SECURITY FIX
    restart: unless-stopped
    networks:
      - media-network

  # Radarr - Movie automation (uses regular internet)
  radarr:
    image: lscr.io/linuxserver/radarr:latest@sha256:95ba0801df4d9d1d79d0d9a3849f656542497dab061d91b87ad4f53a71aff3ef
    container_name: radarr
    environment:
      - PUID=1001
      - PGID=987
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/media-stack/radarr:/config
      - /mnt/hetzner/movies:/movies
      - /mnt/hetzner/downloads:/downloads
    ports:
      - "127.0.0.1:17878:7878"  # LOCALHOST ONLY - SECURITY FIX
    restart: unless-stopped
    networks:
      - media-network

  # Prowlarr - Indexer management (uses regular internet)
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest@sha256:c7502a75b021d964481c129c84590b9cbc40f83aadd4e553f173871bc0deaa3c
    container_name: prowlarr
    environment:
      - PUID=1001
      - PGID=987
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/media-stack/prowlarr:/config
    ports:
      - "127.0.0.1:19696:9696"  # LOCALHOST ONLY - SECURITY FIX
    restart: unless-stopped
    networks:
      - media-network

    # Bazarr - Subtitle management for TV shows and movies (uses regular internet)
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest@sha256:a20fb11a440d704a9d61c283aa26462aad33dc63223b173f8d8c77d33e8e9d59
    container_name: bazarr
    environment:
      - PUID=1001
      - PGID=987
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/media-stack/bazarr:/config
      - /mnt/hetzner/movies:/movies
      - /mnt/hetzner/shows:/tv
    ports:
      - "127.0.0.1:16767:6767"  # LOCALHOST ONLY - SECURITY FIX
    restart: unless-stopped
    depends_on:
      - sonarr
      - radarr
    networks:
      - media-network

  # Jellyseerr - User request interface for Jellyfin (publicly accessible)
  jellyseerr:
    image: ghcr.io/seerr-team/seerr:latest@sha256:f4768de5f616248d723e05891f3345a1402123775d03bf0890dbfedc0831bda1
    init: true
    container_name: jellyseerr
    user: "1001:987"  # match host dir owner (jellyfin:jellyfin)
    environment:
      - LOG_LEVEL=info
      - TZ=Europe/Berlin
      - PORT=5055
    volumes:
      - /var/lib/media-stack/jellyseerr:/app/config
    ports:
      - "127.0.0.1:5055:5055"  # LOCALHOST ONLY - Use nginx reverse proxy for public access
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:5055/api/v1/status || exit 1
      start_period: 20s
      timeout: 3s
      interval: 15s
      retries: 3
    restart: unless-stopped
    networks:
      - media-network

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:latest@sha256:7f173ced3541b46c57c4eb6854765243095c8c8a7563a878044fa0ccfb1f4004
    container_name: sabnzbd
    environment:
      - PUID=1001  # jellyfin user ID
      - PGID=987   # jellyfin group ID
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/media-stack/sabnzbd:/config
      - /mnt/hetzner/downloads:/downloads
      - /mnt/hetzner/downloads/incomplete:/incomplete-downloads  # Optional: separate incomplete
    ports:
      - "127.0.0.1:19090:8080"  # LOCALHOST ONLY - SECURITY FIX
    restart: unless-stopped
    networks:
      - media-network

  # Komga - Comic/manga reader (publicly accessible via nginx)
  komga:
    image: gotson/komga:latest@sha256:6c2a967bbe9acefd05933b2eb498f34afe96a83c6f7f8ab0acb512a1bb3ab50f
    container_name: komga
    environment:
      - TZ=Europe/Berlin
      - KOMGA_OAUTH2ACCOUNTCREATION=true
      # OIDC / Keycloak
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID=komga
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET=${KOMGA_OIDC_SECRET}
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE=openid,email,profile
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_NAME=Keycloak
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE=authorization_code
      - SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI={baseUrl}/login/oauth2/code/{registrationId}
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_ISSUER_URI=https://auth.dumusstbereitsein.de/realms/Abschleppdienst
      - SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE=preferred_username
    volumes:
      - /var/lib/media-stack/komga:/config
      - /mnt/hetzner/comics:/data
    ports:
      - "127.0.0.1:25600:25600"
    user: "1001:987"
    restart: unless-stopped
    networks:
      - media-network

  # Kapowarr - Comic book management (uses regular internet)
  kapowarr:
    image: mrcas/kapowarr:latest@sha256:d455797e4f2c5b1a8ccc5ce05c427f1af2179451bb1af195ca3fa8c3e928623b
    container_name: kapowarr
    environment:
      - PUID=1001
      - PGID=987
      - TZ=Europe/Berlin
    volumes:
      - /var/lib/media-stack/kapowarr:/app/db
      - /mnt/hetzner/downloads:/app/temp_downloads
      - /mnt/hetzner/comics:/comics
    ports:
      - "127.0.0.1:15656:5656"  # LOCALHOST ONLY - SECURITY FIX
    restart: unless-stopped
    networks:
      - media-network

networks:
  media-network:
    driver: bridge
