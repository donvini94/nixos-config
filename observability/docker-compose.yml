# Images are pinned by digest so a rebuild can never pull a different bit-for-bit
# artifact than the one that was reviewed. Renovate proposes digest bumps as PRs;
# the readable tag in front of @sha256: exists only so a human can see the version.

name: observability

services:
  prometheus:
    image: docker.io/prom/prometheus:latest@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    restart: always
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=20GB
      - --web.listen-address=${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${PROMETHEUS_PORT:-19091}
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: docker.io/grafana/grafana:latest@sha256:ac461fb352abc50da10a51c7d02462e9c05488f11f53f14b3ad79a8145f638a0
    restart: always
    network_mode: host
    depends_on:
      - prometheus
    environment:
      GF_SERVER_HTTP_ADDR: ${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-13001}
      PROMETHEUS_PORT: ${PROMETHEUS_PORT:-19091}
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

  node-exporter:
    image: quay.io/prometheus/node-exporter:latest@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
    restart: always
    network_mode: host
    pid: host
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
      - --collector.textfile.directory=/textfile
      - --web.listen-address=${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${NODE_EXPORTER_PORT:-19100}
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
      - /var/lib/observability-stack/textfile:/textfile:ro

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe
    restart: always
    privileged: true
    devices:
      - /dev/kmsg
    ports:
      - ${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${CADVISOR_PORT:-18081}:8080
    command:
      - --docker_only=true
      - --store_container_labels=false
      - --containerd=/run/docker/containerd/containerd.sock
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest@sha256:613ab03c11d442fd960ff515f547e9921537454a712d08160bc8f677f89f1c35
    profiles: [gpu]
    restart: always
    cap_add:
      - SYS_ADMIN
    devices:
      - nvidia.com/gpu=all
    ports:
      - ${OBSERVABILITY_BIND_ADDRESS:-127.0.0.1}:${DCGM_EXPORTER_PORT:-19400}:9400

volumes:
  prometheus_data:
  grafana_data:
